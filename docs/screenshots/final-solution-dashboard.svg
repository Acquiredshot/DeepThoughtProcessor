<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="980" fill="#071B2B"/>
  <rect width="1600" height="980" fill="url(#paint0_radial)"/>

  <g>
    <rect x="80" y="60" width="64" height="64" rx="18" fill="#38BDF8"/>
    <circle cx="112" cy="92" r="20" stroke="#0E1E2A" stroke-width="4"/>
    <path d="M107 85V99M99 92H115" stroke="#0E1E2A" stroke-width="4" stroke-linecap="round"/>
    <path d="M112 71V78M112 106V113M94 83L99 88M125 88L120 83M94 101L99 96M125 96L120 101" stroke="#0E1E2A" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="170" y="104" fill="#E5EEF8" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700">ThoughtProcessor</text>
  <text x="174" y="158" fill="#A8BACB" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400">Autonomous Technical Research Agent</text>

  <g>
    <rect x="80" y="210" width="1420" height="120" rx="26" fill="#1E3043" stroke="#506C85" stroke-width="2"/>
    <text x="120" y="282" fill="#D9E4EE" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="500">agent workflow</text>
    <rect x="1210" y="234" width="240" height="72" rx="18" fill="#61D1F6"/>
    <g transform="translate(1278 245)">
      <circle cx="22" cy="24" r="16" stroke="#08304A" stroke-width="4" fill="none"/>
      <path d="M34 36L49 51" stroke="#08304A" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="1320" y="280" fill="#0B1F2D" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Research</text>
  </g>

  <g>
    <rect x="80" y="390" width="500" height="500" rx="24" fill="#1D2F40" stroke="#465E77" stroke-width="2"/>
    <text x="122" y="470" fill="#56C7F7" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">Gap Analysis</text>

    <text x="122" y="536" fill="#6E8397" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.8">CORE INTENT</text>
    <text x="122" y="582" fill="#E9F2FF" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="500">To understand and improve the efficiency</text>
    <text x="122" y="616" fill="#E9F2FF" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="500">of an agent workflow</text>

    <text x="122" y="684" fill="#6E8397" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.8">KNOWNS</text>
    <rect x="122" y="704" width="408" height="58" rx="8" fill="#24384B"/>
    <text x="140" y="742" fill="#D7E8F8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">Agents are autonomous entities that perform</text>
    <text x="140" y="772" fill="#D7E8F8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">tasks on behalf of users.</text>

    <text x="122" y="840" fill="#6E8397" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.8">UNKNOWNS</text>
    <rect x="122" y="858" width="408" height="62" rx="8" fill="#481C2B"/>
    <text x="140" y="897" fill="#FBC6D0" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="500">The specific tasks within the workflow.</text>
  </g>

  <g>
    <rect x="630" y="390" width="870" height="500" rx="24" fill="#1E3146" stroke="#4A6078" stroke-width="2"/>
    <text x="688" y="470" fill="#56C7F7" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">Final Solution</text>

    <text x="688" y="536" fill="#7A8EA1" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.8">THE TL;DR</text>
    <text x="688" y="590" fill="#E7EFF8" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="500">To improve the efficiency of an agent workflow in a serverless</text>
    <text x="688" y="628" fill="#E7EFF8" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="500">environment, use a proxy like RDS Proxy or PgBouncer to manage</text>
    <text x="688" y="666" fill="#E7EFF8" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="500">PostgreSQL connections centrally, or leverage Prisma Accelerate's</text>
    <text x="688" y="704" fill="#E7EFF8" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="500">global database proxy for connection pooling.</text>

    <text x="688" y="770" fill="#7A8EA1" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.8">IMPLEMENTATION PATTERN</text>
    <rect x="688" y="795" width="760" height="56" rx="12" fill="#0A1420" stroke="#506C85" stroke-width="1.5"/>
    <text x="718" y="832" fill="#BDE8FF" font-family="Consolas, Monaco, monospace" font-size="24" font-weight="500">Use RDS Proxy or PgBouncer to manage connections centrally, or implement</text>

    <text x="688" y="894" fill="#7A8EA1" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.8">VERIFIED REFERENCES</text>
    <rect x="688" y="912" width="360" height="50" rx="10" fill="#24384B"/>
    <text x="714" y="943" fill="#EAF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500">Managing PostgreSQL Connection…</text>
    <rect x="1088" y="912" width="360" height="50" rx="10" fill="#24384B"/>
    <text x="1114" y="943" fill="#EAF4FF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500">Prisma Connection Pooling</text>
  </g>

  <defs>
    <radialGradient id="paint0_radial" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(800 480) rotate(90) scale(760 1400)">
      <stop stop-color="#0A1F31"/>
      <stop offset="1" stop-color="#071B2B"/>
    </radialGradient>
  </defs>
